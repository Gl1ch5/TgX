<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коды Telegram — TeleX</title>
<meta name="theme-color" content="#17212b">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1621; color: #e9eef3; font: 16px/1.4 Roboto, system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
  header { background: #17212b; padding: 12px 16px; display: flex; align-items: center; gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); }
  header .ava { width: 40px; height: 40px; border-radius: 50%; background: #3390ec; display: grid; place-items: center; font-weight: 700; }
  header .t { flex: 1; min-width: 0; }
  header .t b { display: block; }
  header .t small { color: #6d7f8f; }
  button { background: #2b5278; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .msg { align-self: flex-start; max-width: min(560px, 92%); background: #182533; border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
  .msg time { display: block; text-align: right; color: #6d7f8f; font-size: 12px; margin-top: 4px; }
  .code { background: #2b5278; border-radius: 6px; padding: 0 6px; font: 700 1.15em ui-monospace, monospace; letter-spacing: 2px; cursor: pointer; }
  .code.ok { background: #2f9e5f; }
  #state { text-align: center; color: #6d7f8f; padding: 24px 16px; }
  #state a { color: #58a6ff; }
</style>
</head>
<body>
<header>
  <div class="ava">T</div>
  <div class="t"><b>Telegram</b><small id="sub">подключение…</small></div>
  <button id="refresh">Обновить</button>
</header>
<div id="list"><div id="state">Загрузка…</div></div>
<script type="module">
import { TelegramClient, Api, StringSession } from '../js/vendor/gramjs.js';

// Same public app credentials as TeleX itself; the session is the one TeleX already stored.
const API_ID = 27451332, API_HASH = '1462d961e4a7bf6b5139309255f09fd6';
const SERVICE = 777000; // official "Telegram" chat: login codes arrive here
const $ = (id) => document.getElementById(id);
const list = $('list'), state = $('state'), sub = $('sub');

function stored() { try { return JSON.parse(localStorage.getItem('telex.session') || '""'); } catch { return ''; } }

function render(msgs) {
  list.textContent = '';
  if (!msgs.length) { list.append(state); state.textContent = 'Сообщений пока нет.'; return; }
  for (const m of msgs.slice().reverse()) {
    const d = document.createElement('div'); d.className = 'msg';
    const text = m.message || '';
    let last = 0;
    for (const x of text.matchAll(/\b\d{5,6}\b/g)) {
      d.append(text.slice(last, x.index));
      const c = document.createElement('span'); c.className = 'code'; c.textContent = x[0];
      c.onclick = () => { navigator.clipboard?.writeText(x[0]).catch(() => {}); c.classList.add('ok'); };
      d.append(c); last = x.index + x[0].length;
    }
    d.append(text.slice(last));
    const t = document.createElement('time'); t.textContent = new Date(m.date * 1000).toLocaleString('ru-RU');
    d.append(t); list.append(d);
  }
  list.scrollTop = list.scrollHeight;
}

(async () => {
  const s = stored();
  if (!s) { state.innerHTML = 'Вы не вошли. Откройте <a href="../">TeleX</a>, войдите и вернитесь сюда.'; sub.textContent = 'нет сессии'; return; }
  const client = new TelegramClient(new StringSession(s), API_ID, API_HASH, { connectionRetries: 5, useWSS: true, deviceModel: 'TeleX Web', langCode: 'ru' });
  client.setLogLevel('error');
  let busy = false, lastId = 0;
  async function load() {
    if (busy) return; busy = true;
    try {
      if (!client.connected) await client.connect();
      const msgs = await client.getMessages(SERVICE, { limit: 30 });
      sub.textContent = 'онлайн';
      if (!msgs.length || msgs[0].id !== lastId) { lastId = msgs[0]?.id || 0; render(msgs); }
    } catch (e) { sub.textContent = 'ошибка: ' + (e.message || e); }
    busy = false;
  }
  $('refresh').onclick = load;
  await load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
