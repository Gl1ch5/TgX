  <title>TeleX — стена каналов Telegram</title>
  <meta name="theme-color" content="#000000" />
  <script>
    // Theme before the first paint (no dark flash on a light phone): saved choice or the device's.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('telex.prefs') || '{}');
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        if (t === 'light') { r.classList.remove('dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f0f0f5'); }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Все ваши Telegram-каналы одной лентой. Работает прямо в браузере." />

  <!-- Fonts: Roboto & JetBrains Mono (Telegram Native) -->

  <!-- Tailwind CSS -->

    window.tailwind = { config: {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Helvetica Neue', 'sans-serif'],

            tg: {
              bg: '#0f0f0f',

              borderStrong: 'rgba(255, 255, 255, 0.16)',
              blue: '#3390ec',
              blueHover: '#267fd9',
              blueSoft: 'rgba(51, 144, 236, 0.16)',
              link: '#58a6ff',
              label: '#79a7f7',
              gray: '#8a8a90',
              gray2: '#6c6c70',
              red: '#ff3b30',
              green: '#4fae4e',

<body class="tx">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="tx-story-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fc183"/><stop offset="1" stop-color="#2c9efc"/></linearGradient>
      <linearGradient id="tx-story-cf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#81ce2d"/><stop offset="1" stop-color="#18bd36"/></linearGradient>
    </defs>
  </svg>

  <div id="app" class="tx-app" data-view="wall">

    <!-- ================================================================ -->
    <!-- WALL                                                              -->
    <!-- ================================================================ -->
    <section id="screen-wall" class="tx-screen">
      <div class="tx-column">
        <!-- Telegram main-screen header: stories stack + title, pull-down stories row, search -->
        <div id="wall-top" class="tx-maintop">
          <div class="tx-mainbar">
            <button id="stories-stack" class="tx-stories-stack" onclick="window.TelegramX.openStackStories()" title="Истории"></button>
            <h1 class="tx-mainbar-title" onclick="window.TelegramX.headerPill()">TeleX</h1>
            <button class="tx-icon-btn tx-mainbar-search" onclick="window.TelegramX.focusSearch()" title="Поиск"><i class="icon icon-search"></i></button>
            <button class="tx-icon-btn" onclick="window.TelegramX.openMainMenu(event)" title="Меню"><i class="icon icon-more"></i></button>
          </div>
          <div id="stories-row" class="tx-stories-row"><div class="tx-stories-scroll"></div></div>
        </div>

        <!-- Channel header (when the wall is filtered to one channel) -->
        <header class="tx-header tx-channel-header">
          <button id="header-left-btn" class="tx-circle tx-glass" onclick="window.TelegramX.headerLeft()" title="Назад">
            <i class="icon icon-arrow-left" id="header-left-icon"></i>
          </button>
          <div class="tx-pill tx-glass" onclick="window.TelegramX.headerPill()">
            <div id="header-stack" class="tx-stack"></div>
            <div class="tx-pill-text">
              <span class="tx-pill-title"><span id="header-main-title">Стена</span><span id="header-verified-badge"></span></span>
              <span class="tx-pill-sub" id="header-sub-title">все ваши каналы</span>
            </div>
          </div>
          <button class="tx-circle tx-glass" onclick="window.TelegramX.openChannelMenu(event)" title="Ещё">
            <i class="icon icon-more"></i>
          </button>
        </header>
        <button id="channel-pinned" class="tx-pinned tx-glass tx-hidden" onclick="window.TelegramX.jumpToPinned()"></button>

        <label id="header-search-bar" class="tx-search tx-search-main">
          <i class="icon icon-search"></i>
          <input type="search" id="search-input" placeholder="Поиск публикаций" autocomplete="off" enterkeyhint="search"
                 onkeydown="if(event.key==='Enter') window.TelegramX.doSearch()" oninput="if(!this.value) window.TelegramX.clearSearch()" />
          <button class="tx-icon-btn tx-search-clear" onclick="event.preventDefault(); window.TelegramX.toggleHeaderSearch(false)" title="Очистить">
            <i class="icon icon-close" style="font-size:20px"></i>
          </button>
        </label>

        <div class="tx-subbar">
          <nav class="tx-tabs tx-glass" id="feed-tabs">
            <button class="tx-tab is-active" data-feed="all" onclick="window.TelegramX.switchFeedType('all')">Все <span class="tx-badge tx-hidden" id="tab-unread-badge"></span></button>
            <button class="tx-tab" data-feed="media" onclick="window.TelegramX.switchFeedType('media')">Медиа</button>
            <button class="tx-tab" data-feed="popular" onclick="window.TelegramX.switchFeedType('popular')">Популярное</button>
            <button class="tx-tab" data-feed="favorites" onclick="window.TelegramX.switchFeedType('favorites')">Избранное</button>
          </nav>
        </div>

        <div id="feed-loader" class="tx-feed tx-hidden"><div class="sk-wrap is-loader" aria-hidden="true"><div class="sk-card" style="--i:0"><div class="sk-head"><i class="sk-ava"></i><i class="sk-line" style="width:34%"></i></div><i class="sk-media" style="height:190px"></i><i class="sk-line" style="width:92%"></i><i class="sk-line" style="width:78%"></i><i class="sk-line" style="width:46%"></i><div class="sk-chips"><i class="sk-chip"></i><i class="sk-chip"></i><i class="sk-chip" style="width:46px"></i></div></div><div class="sk-card" style="--i:1"><div class="sk-head"><i class="sk-ava"></i><i class="sk-line" style="width:41%"></i></div><i class="sk-line" style="width:88%"></i><i class="sk-line" style="width:64%"></i><div class="sk-chips"><i class="sk-chip"></i><i class="sk-chip"></i><i class="sk-chip" style="width:46px"></i></div></div><div class="sk-card" style="--i:2"><div class="sk-head"><i class="sk-ava"></i><i class="sk-line" style="width:48%"></i></div><i class="sk-media" style="height:150px"></i><i class="sk-line" style="width:96%"></i><i class="sk-line" style="width:84%"></i><i class="sk-line" style="width:70%"></i><i class="sk-line" style="width:38%"></i></div></div></div>

        <div id="feed-empty-state" class="tx-empty tx-empty-card tx-glass tx-hidden">
          <div class="tx-empty-icon"><i class="icon icon-channel-filled"></i></div>
          <h2>Все каналы — одной лентой</h2>
          <p>Войдите в Telegram, и публикации всех ваших каналов соберутся на одной стене. Сессия хранится только в этом браузере.</p>
          <button class="tx-btn" onclick="window.TelegramX.openAuthModal()">Войти в Telegram</button>
        </div>

        <div id="posts-container" class="tx-feed"><div class="sk-wrap" aria-hidden="true"><div class="sk-card" style="--i:0"><div class="sk-head"><i class="sk-ava"></i><i class="sk-line" style="width:34%"></i></div><i class="sk-media" style="height:190px"></i><i class="sk-line" style="width:92%"></i><i class="sk-line" style="width:78%"></i><i class="sk-line" style="width:46%"></i><div class="sk-chips"><i class="sk-chip"></i><i class="sk-chip"></i><i class="sk-chip" style="width:46px"></i></div></div><div class="sk-card" style="--i:1"><div class="sk-head"><i class="sk-ava"></i><i class="sk-line" style="width:41%"></i></div><i class="sk-line" style="width:88%"></i><i class="sk-line" style="width:64%"></i><div class="sk-chips"><i class="sk-chip"></i><i class="sk-chip"></i><i class="sk-chip" style="width:46px"></i></div></div><div class="sk-card" style="--i:2"><div class="sk-head"><i class="sk-ava"></i><i class="sk-line" style="width:48%"></i></div><i class="sk-media" style="height:150px"></i><i class="sk-line" style="width:96%"></i><i class="sk-line" style="width:84%"></i><i class="sk-line" style="width:70%"></i><i class="sk-line" style="width:38%"></i></div></div></div>
        <script>try{if(!localStorage.getItem("telex.session")){var w=document.querySelector("#posts-container .sk-wrap");w&&w.remove();}}catch(e){}</script>

        <div class="tx-chbar" id="channel-bar">
          <button class="tx-circle tx-glass" onclick="window.TelegramX.toggleHeaderSearch(true)" title="Поиск"><i class="icon icon-search"></i></button>
          <button class="tx-chbar-main tx-glass" id="channel-mute-btn" onclick="window.TelegramX.toggleWallChannelMute()">Убрать звук</button>
          <button class="tx-circle tx-glass" onclick="window.TelegramX.copyChannelLink(window.TelegramX.activeChannel())" title="Ссылка"><i class="icon icon-share-filled"></i></button>
        </div>

        <div id="feed-sentinel" class="tx-sentinel">
          <span class="animate-spin tx-hidden" id="sentinel-spinner"><i class="icon icon-reload"></i></span>
          <span id="sentinel-text" class="tx-service tx-hidden"></span>
        </div>
      </div>
    </section>

    <!-- ================================================================ -->
    <!-- CHANNEL PAGE                                                      -->
    <!-- ================================================================ -->
    <section id="screen-channel" class="tx-screen">
      <div class="tx-column" id="channel-root"></div>
    </section>

    <!-- ================================================================ -->
    <!-- DISCUSSION (comments)                                             -->
    <!-- ================================================================ -->
    <section id="screen-thread" class="tx-screen">
      <div class="tx-column">
        <header class="tx-header">
          <button class="tx-circle tx-glass" onclick="window.TelegramX.back()" title="Назад"><i class="icon icon-arrow-left"></i></button>
          <div class="tx-pill tx-glass">
            <span id="thread-avatar" class="tx-stack"></span>
            <div class="tx-pill-text">
              <span class="tx-pill-title"><span id="thread-title">Комментарии</span></span>
              <span class="tx-pill-sub tx-hidden" id="thread-sub"></span>
            </div>
          </div>
          <button class="tx-circle tx-glass" onclick="window.TelegramX.toggleThreadSearch()" title="Поиск"><i class="icon icon-search"></i></button>
        </header>
        <label id="thread-search" class="tx-search tx-search-main tx-hidden">
          <i class="icon icon-search"></i>
          <input type="search" id="thread-search-input" placeholder="Поиск в комментариях" autocomplete="off" oninput="window.TelegramX.searchThread(this.value)" />
          <button class="tx-icon-btn" onclick="event.preventDefault(); window.TelegramX.toggleThreadSearch(false)" title="Закрыть"><i class="icon icon-close" style="font-size:20px"></i></button>
        </label>
        <div id="thread-list" class="tx-thread-list"></div>
      </div>
      <div class="tx-composer">
        <div class="tx-composer-inner">
          <div id="thread-emoji" class="tx-emoji-pop tx-glass tx-hidden"></div>
          <div id="thread-reply-bar" class="tx-reply-bar tx-glass tx-hidden"></div>
          <div class="tx-composer-row">
            <div class="tx-composer-field tx-glass">
              <span id="thread-me" class="tx-composer-me"></span>
              <button class="tx-icon-btn" onclick="window.TelegramX.toggleThreadEmoji()" title="Эмодзи"><i class="icon icon-smile"></i></button>
              <textarea id="thread-input" rows="1" placeholder="Комментарий"
                oninput="window.TelegramX.autosizeComposer(this)"
                onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); window.TelegramX.sendThreadComment();}"></textarea>
            </div>
            <button class="tx-send-btn" id="thread-send" onclick="window.TelegramX.sendThreadComment()" title="Отправить"><i class="icon icon-send"></i></button>
          </div>
          <button id="thread-jump" class="tx-thread-jump tx-glass tx-hidden" onclick="window.TelegramX.threadJumpDown()" title="Вниз">
            <i class="icon icon-arrow-down"></i><span class="tx-badge tx-hidden" id="thread-jump-count"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- ================================================================ -->
    <!-- SETTINGS (rendered by views/settings.js)                          -->
    <!-- ================================================================ -->
    <section id="screen-settings" class="tx-screen">
      <div class="tx-column" id="settings-root"></div>
    </section>

    <!-- ================================================================ -->
    <!-- PROFILE (rendered by views/profile.js)                            -->
    <!-- ================================================================ -->
    <section id="screen-profile" class="tx-screen">
      <div class="tx-column" id="profile-root"></div>
    </section>

    <!-- ================================================================ -->
    <!-- FLOATING TAB BAR                                                 -->
    <!-- ================================================================ -->
    <div class="tx-dock-fade"></div>
    <nav class="tx-dock" id="dock">
      <button class="tx-dock-tab is-active" data-view="wall" data-icon="chats" onclick="window.TelegramX.setView('wall')">
        <span class="tx-tab-icon"><i class="icon icon-folder-tabs-chats"></i></span>
        <span class="tx-tab-label">Стена</span>
        <span class="tx-badge tx-hidden" id="dock-unread-badge"></span>
      </button>
      <button class="tx-dock-tab" data-view="settings" data-icon="settings" onclick="window.TelegramX.setView('settings')">
        <span class="tx-tab-icon"><i class="icon icon-settings"></i></span>
        <span class="tx-tab-label">Настройки</span>
      </button>
      <button class="tx-dock-tab" data-view="profile" onclick="window.TelegramX.setView('profile')">
        <span class="tx-tab-icon"><span id="dock-user-avatar" class="tx-avatar tx-peer-5"><i class="icon icon-user" style="font-size:13px"></i></span></span>
        <span class="tx-tab-label">Профиль</span>
      </button>
    </nav>
  </div>

  <!-- WALLPAPERS SELECTOR MODAL -->
  <div id="wallpaper-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-4" onclick="window.TelegramX.closeWallpaperModal()">
    <div class="liquid-glass rounded-3xl w-full max-w-xl p-5 relative shadow-2xl max-h-[85vh] flex flex-col border border-white/15" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <h2 class="text-lg font-medium text-white flex items-center gap-2">
          <i class="icon icon-darkmode text-xl text-[#3390ec]"></i>
          Обои для фона
        </h2>
        <button onclick="window.TelegramX.closeWallpaperModal()" class="w-8 h-8 rounded-full hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="icon icon-close text-base"></i>
        </button>
      </div>

      <div class="py-2">
        <p class="text-xs text-[#8a8a90]">Выберите оригинальный фон Telegram с векторным паттерном или глубокий OLED Black.</p>
      </div>

      <div id="wallpaper-grid-list" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 overflow-y-auto pr-1 flex-1 py-1.5">
        <!-- Rendered by components/wallpaperTheme.js -->
      </div>
    </div>
  </div>

  <!-- LOGIN (rendered by components/authModal.js) -->
  <div id="auth-modal" class="tx-auth tx-hidden"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="tx-toast fixed bottom-20 left-1/2 -translate-x-1/2 liquid-glass border border-white/15 px-4 py-2 rounded-full text-xs font-medium text-white shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
    <i class="icon icon-check-bold text-sm text-[#4fae4e]"></i>
    <span id="toast-msg">Готово</span>
  </div>

  <!-- JavaScript ES Modules Entrypoint -->
  <script type="module" src="js/app.js?v=3.14.0"></script>
</body>
</html>
