<div class="login-container">
    <div class="login-header">
        <div class="app-icon">
            <!-- Reuse an SVG or use simple text -->
            <h2>TeleX</h2>
        </div>
        <h1>Log in to TeleX</h1>
        <p>Enter your phone number to log in via Telegram.</p>
    </div>

    <form id="loginForm" class="login-form">
        <!-- Step 1: Phone Number -->
        <div id="step1">
            <div class="input-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="+1234567890" required />
            </div>
            <button type="submit" id="sendCodeBtn" class="primary-btn">Send Code</button>
            <div id="phoneError" class="error-msg" style="display:none;"></div>
        </div>

        <!-- Step 2: Auth Code -->
        <div id="step2" style="display:none;">
            <p class="info-text">We sent a code to your Telegram app.</p>
            <div class="input-group">
                <label for="authCode">Verification Code</label>
                <input type="text" id="authCode" placeholder="12345" />
            </div>
            <button type="button" id="loginBtn" class="primary-btn">Log In</button>
            <div id="codeError" class="error-msg" style="display:none;"></div>
        </div>

        <!-- Step 3: Cloud Password -->
        <div id="step3" style="display:none;">
            <p class="info-text">Two-Factor Authentication is enabled on this account.</p>
            <div class="input-group">
                <label for="cloudPassword">Cloud Password</label>
                <input type="password" id="cloudPassword" placeholder="Enter your password" />
            </div>
            <button type="button" id="passwordBtn" class="primary-btn">Submit Password</button>
            <div id="passwordError" class="error-msg" style="display:none;"></div>
        </div>
    </form>
</div>
