name: Android APK

on:
  push:
    branches: [main, ccr-297b0b47-05qrmt]
    paths:
      - 'native/android/**'
      - 'app/static/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish to a versioned GitHub release with this tag (e.g. v1.0.0-beta)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4

      # versionCode must only ever grow (the in-app updater compares it): minutes since 1970 never go back,
      # unlike the workflow run number, which restarts when a workflow is recreated.
      - name: Version
        working-directory: .
        run: |
          app=$(grep -oP "APP_VERSION = '\K[^']+" app/static/js/version.js)
          echo "TELEX_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "TELEX_VERSION_NAME=${app}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set - publishing the debug-signed APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/telex-release.jks"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.enabled == 'true'
        env:
          TELEX_KEYSTORE_FILE: ${{ runner.temp }}/telex-release.jks
          TELEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TELEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TELEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          release=app/build/outputs/apk/release/app-release.apk
          debug=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$release" ]; then
            cp "$release" dist/TeleX-android.apk
            cp "$debug" dist/TeleX-android-debug.apk
          else
            cp "$debug" dist/TeleX-android.apk
          fi
          cat > dist/version.json <<JSON
          {
            "versionCode": ${TELEX_VERSION_CODE},
            "versionName": "${TELEX_VERSION_NAME}",
            "apk": "https://github.com/${{ github.repository }}/releases/download/nightly/TeleX-android.apk",
            "commit": "${{ github.sha }}"
          }
          JSON
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TeleX-android
          path: native/android/dist/*.apk
          if-no-files-found: error

      # Shared "nightly" pre-release: only our own assets are replaced,
      # files uploaded by other workflows (e.g. Windows) are left alone.
      - name: Attach to the nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            native/android/dist/*.apk
            native/android/dist/version.json

      # A normal, easy-to-find release (Releases page): run this workflow by hand with release_tag = v1.0.0-beta.
      - name: Attach to the versioned release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: TeleX ${{ inputs.release_tag }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            **TeleX 1.0 beta** — Telegram channels as one feed, with mods, themes and an optional free Groq key for AI features.

            - Android: `TeleX-android.apk` (updates itself afterwards)
            - Windows: `TeleX-Setup.exe` or `TeleX-Portable.exe`
            - Web: https://telex-web.ru/app/static/
          files: |
            native/android/dist/TeleX-android.apk
            native/android/dist/version.json
